# Source photos, generated site, and persistent thumbnail cache.
ALBUMS_DIR=/mnt/gallery/albums
OUTPUT_DIR=/mnt/gallery/dist
THUMBNAILS_DIR=/mnt/gallery/thumbnails
CADDYFILE=/etc/caddy/Caddyfile

# Plaintext passwords are hashed by generate-gallery.sh and are never written
# to Caddyfile. Keep this file private (chmod 600 photina.conf).
ADMIN_PASSWORD=admin
GUEST_PASSWORD=guest

# Album directory names guests may access. Quote each item to preserve spaces
# and other characters.
GUEST_ALBUMS=(
  # "Family Photos"
  # "Summer 2025"
)

# Thumbnail width and height in pixels.
THUMBNAIL_SIZE=250
